<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Threads Organizer</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/></svg>
      <span class="brand-name">Threads Organizer</span>
      <span class="brand-credit">| by Dr. Kangabu</span>
    </div>
    <input id="search" type="search" placeholder="Search posts, authors, notes, tags">
    <div class="row">
      <button id="open-saved">Import saved…</button>
      <button id="export-md">Export MD</button>
      <button id="export-json">Export JSON</button>
      <label class="btn">Import JSON<input id="import-json" type="file" accept="application/json" hidden></label>
    </div>
    <div id="status" role="status"></div>
  </header>
  <nav>
    <div id="folders"></div>
    <form id="new-folder"><input id="folder-name" placeholder="New folder"><button>Add</button></form>
    <div id="tags"></div>
    <div id="filters">
      <select id="author" aria-label="Author"><option value="">All authors</option></select>
      <label>From <input id="date-from" type="date"></label>
      <label>To <input id="date-to" type="date"></label>
    </div>
  </nav>
  <main id="posts"></main>
  <script type="module" src="panel.js"></script>
</body>
</html>
