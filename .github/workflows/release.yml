name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag must match manifest version
        run: test "v$(jq -r .version manifest.json)" = "${GITHUB_REF_NAME}"
      - name: Test before packaging
        run: npm ci && npm test
      - name: Build zip
        run: zip -r -X "threads-organizer-${GITHUB_REF_NAME}.zip" manifest.json src docs LICENSE README.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: threads-organizer-*.zip
          generate_release_notes: true
